name: CI

# Auto-trigger on push/PR is disabled until the GitHub Actions
# billing flag on this fork's owner account is cleared. Until then,
# every run fails immediately with "account is locked" and spams the
# inbox. Once unblocked, restore by uncommenting the push/pull_request
# blocks below.
#
# on:
#   push:
#     branches: [main, "feat/**", "fix/**", "feature/**"]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

      - name: Vet
        run: go vet ./...
