telegram:
  app_id: ${TG_APP_ID}
  api_hash: ${TG_API_HASH}
  session_path: ~/.config/mcp-telegram/session.json

acl:
  chats:
    - match: "@username"
      permissions: [read, draft, mark_read]
    - match: "user:123456789"
      permissions: [read]
    - match: "chat:4626931529"
      permissions: [read]
    - match: "channel:2225853048"
      permissions: [read, mark_read]

limits:
  max_messages_per_request: 50
  max_dialogs_per_request: 100
  rate:
    requests_per_second: 2.0
    burst: 3
  # Optional: throttle destructive actions (send, forward, draft)
  # per-chat. Useful to prevent an LLM stuck in a loop from spamming
  # one person. Leave commented to disable (default).
  # send_per_chat:
  #   requests_per_second: 0.2  # one message every 5 seconds per chat
  #   burst: 2

media:
  # download: [photo, document, video, voice, audio]
  # directory: ~/telegram-media
  # allowed_upload_dirs:
  #   - ~/Documents
  #   - ~/Downloads

logging:
  level: info
  file: ""
  # JSONL audit trail of every destructive tool invocation
  # (tg_send, tg_forward, tg_draft, tg_mark_read).
  # File is created with 0600 permissions; long fields are truncated.
  # Leave empty to disable.
  audit_file: ~/.config/mcp-telegram/audit.log
